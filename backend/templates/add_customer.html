<!DOCTYPE html>
<html>

<head>

    <title>Add Customer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>Add New Customer</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Account Number</label>

                        <input
                            class="form-control"
                            name="account_number"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Account Type</label>

                        <select
                            class="form-control"
                            name="account_type">

                            <option>Savings</option>
                            <option>Current</option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>First Name</label>

                        <input
                            class="form-control"
                            name="first_name"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Last Name</label>

                        <input
                            class="form-control"
                            name="last_name"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Balance</label>

                        <input
                            class="form-control"
                            name="balance"
                            type="number"
                            step="0.01"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Phone</label>

                        <input
                            class="form-control"
                            name="phone"
                            required>

                    </div>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        class="form-control"
                        name="email">

                </div>

                <div class="mb-3">

                    <label>Address</label>

                    <input
                        class="form-control"
                        name="address">

                </div>

                <div class="mb-3">

                    <label>Branch</label>

                    <input
                        class="form-control"
                        name="branch">

                </div>

                <button
                    class="btn btn-success">

                    Save Customer

                </button>

                <a
                    href="/customers"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
